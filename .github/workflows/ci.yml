name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,model]"

      - name: Unit and pipeline tests
        run: pytest -q

      - name: Offline replay smoke test
        # Runs the command-line entry point on the same engine the live scorer uses, without Kafka.
        # It only fails if the replay crashes; the block-rate thresholds are asserted in pytest.
        run: |
          python -m fraudradar.evaluate --seconds 40 --tps 80
          python -m fraudradar.evaluate --seconds 40 --tps 80 --scorer lightgbm
          python -m fraudradar.skew --seconds 30 --tps 80

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the map script parses
        run: node --check src/fraudradar/api/static/app.js
