name: fraudradar

x-app: &app
  build: .
  environment:
    KAFKA_BOOTSTRAP: redpanda:9092
  volumes:
    - ./src:/app/src
  depends_on:
    topics-init:
      condition: service_completed_successfully

services:
  # Redpanda speaks the Kafka protocol with a single lightweight binary.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # One partition keeps event order, which the single in-memory scorer relies on.
    command:
      - rpk topic create transactions decisions control --brokers redpanda:9092 --partitions 1 --replicas 1 || true
    restart: "no"

  simulator:
    <<: *app
    command: ["python", "-m", "fraudradar.simulator"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      SIM_TPS: "120"

  scorer:
    <<: *app
    command: ["python", "-m", "fraudradar.scorer"]

  api:
    <<: *app
    command: ["uvicorn", "fraudradar.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
